{% extends "base.html" %}

<title>{% block title %}
Iniciar Sesión
{% endblock title %}</title>


{% block content %}
<div class="container mt-5">
    <div class="card bg-dark border border-light shadow">
        <div class="card-header bg-dark border-bottom border-light text-center">
            <h3 class="text-light mb-0">Iniciar Sesión</h3>
        </div>

        <div class="card-body text-light">
            {% if form.errors %}
            <div class="alert alert-danger text-center" role="alert">
                Las credenciales no coinciden. Inténtalo nuevamente.
            </div>          
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <!-- Usuario -->
                <div class="mb-4">
                    <label for="nombre_usuario-id" class="form-label"><strong>Nombre de usuario</strong></label>
                    <input 
                        type="text" 
                        class="form-control bg-dark text-light border-secondary" 
                        id="nombre_usuario-id" 
                        name="username"
                        placeholder="Ingresa tu nombre de usuario"
                        {% if form.errors %}
                            value="{{form.username.value}}"
                        {% endif %}
                    >
                </div>

                <!-- Contraseña -->
                <div class="mb-4">
                    <label for="contra-id" class="form-label"><strong>Contraseña</strong></label>
                    <input 
                        type="password" 
                        class="form-control bg-dark text-light border-secondary" 
                        id="contra-id" 
                        name="password"
                        placeholder="••••••••"
                    >
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="submit" class="btn btn-primary px-3" 
                          style="background-color: #0d6efd; border-color: #0d6efd;">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                  </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Estilos para mantener coherencia visual -->
<style>
    input[type="text"],
    input[type="password"],
    select,
    textarea {
        background-color: #212529 !important;
        color: #f8f9fa !important;
        border: 1px solid #6c757d !important;
        border-radius: 0.375rem;
        padding: 0.5rem;
        width: 100%;
        font-size: 1rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none !important;
        border-color: #adb5bd !important;
        box-shadow: 0 0 0 0.2rem rgba(173, 181, 189, 0.25);
    }

    ::placeholder {
        color: #adb5bd !important;
    }

    input:disabled {
        background-color: #343a40 !important;
        color: #ced4da !important;
    }

    .card {
        border-radius: 0.75rem;
    }

    .card-header h3 {
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .btn-primary:hover {
        background-color: #444 !important;
        border-color: #444 !important;
    }

    .alert {
        border-radius: 0.5rem;
    }
</style>
{% endblock content %}
